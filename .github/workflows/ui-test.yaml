name: ui-test
on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          # renovate: datasource=node-version depName=node versioning=node allowedVersions=^22
          - 22.x
          # renovate: datasource=node-version depName=node versioning=node
          - 24.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: ./ui
      - run: npm run lint
        working-directory: ./ui
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          # renovate: datasource=node-version depName=node versioning=node allowedVersions=^22
          - 22.x
          # renovate: datasource=node-version depName=node versioning=node
          - 24.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: ./ui
      - run: npm run check:crd-types
        working-directory: ./ui
      - run: npm run test
        working-directory: ./ui

